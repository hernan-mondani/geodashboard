name: Weekly snapshot

on:
  schedule:
    - cron: "0 6 * * 1"   # every Monday, 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: weekly-snapshot
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install a browser for the PDF
        run: npm install --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Take this week's snapshot
        run: node scripts/snapshot.mjs
      - name: Build pages and PDF
        run: node scripts/build.mjs --pdf
      - name: Keep the snapshot in the repository
        run: |
          git config user.name "weekly-snapshot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git commit -m "Weekly snapshot $(date -u +%G-W%V)" || echo "No changes"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
